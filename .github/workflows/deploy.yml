name: Deploy to GitHub Pages

# Builds the Vite app and deploys it to GitHub Pages. Runs on every push to main
# — including the Python pipeline's data commits, so a fresh site_data drop
# rebuilds and publishes automatically. Also runnable on demand.
#
# The workflow_run trigger exists because the availability refresh commits with
# the workflow GITHUB_TOKEN, and GitHub's recursion guard means those pushes
# never fire `on: push` — without it the daily data would land on main but the
# live site would keep serving the old file.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh availability data", "Refresh odds data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
