name: Deploy to GitHub Pages

# Builds the Vite app and deploys it to GitHub Pages. Runs on every push to main
# — including the Python pipeline's data commits, so a fresh site_data drop
# rebuilds and publishes automatically. Also runnable on demand.
#
# The workflow_run trigger exists because the availability refresh commits with
# the workflow GITHUB_TOKEN, and GitHub's recursion guard means those pushes
# never fire `on: push` — without it the daily data would land on main but the
# live site would keep serving the old file.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh availability data", "Refresh odds data", "Refresh pre-season squad data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Our own Cloudflare Worker relay for live FPL calls (worker/README.md).
          # Set as a repository variable; while it is empty the app falls back to
          # the public CORS relays and the privacy notice says so.
          VITE_FPL_PROXY: ${{ vars.VITE_FPL_PROXY }}
          # Ko-fi / Buy Me a Coffee page. Unset means no link renders at all.
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          # GoatCounter endpoint, e.g. https://fplanalyser.goatcounter.com/count.
          # Unset and no counting script is loaded and no request is made — so a
          # fork, a local build and a preview are all genuinely uncounted, and
          # the privacy notice says so because it reads the same flag.
          VITE_GOATCOUNTER: ${{ vars.VITE_GOATCOUNTER }}
      # Same tree the mirror job publishes. One day of retention: this runs on
      # every data refresh, several times a day, and the artefact is 37 MB.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A second copy of the same build, published on a plain github.io address.
  #
  # fplanalyser.co.uk is miscategorised as gambling by at least one corporate
  # web filter (docs/DOMAIN_CATEGORISATION.md), so on some office networks the
  # site is simply unreachable — and because the custom domain is set on this
  # account's *user* Pages site, GitHub redirects fplanalyser.github.io to it,
  # which means the github.io address is blocked by proxy. It cascades to every
  # project site on the account too, so the mirror has to live under a separate
  # org to escape it.
  #
  # Deliberately not a fallback the app knows about: same artefact, no code
  # path, nothing to keep in sync. It goes stale only if this job fails, and it
  # cannot take the real deploy down with it — `deploy` does not need it.
  mirror:
    needs: build
    # Unset the variable and the mirror quietly stops being a thing.
    if: ${{ vars.MIRROR_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to the mirror
        env:
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "MIRROR_REPO is set but MIRROR_TOKEN is not — nothing to push with." >&2
            exit 1
          fi

          # git reports a missing repo and an unauthorised one identically, both
          # "Repository not found", which leaves you guessing between a repo that
          # was never created and a token that cannot see it. Asking the API
          # twice — once anonymously, once as the token — separates them.
          code() { curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$@"; }
          API="https://api.github.com/repos/${MIRROR_REPO}"
          anon=$(code "$API")
          auth=$(code -H "Authorization: Bearer ${MIRROR_TOKEN}" "$API")
          echo "repo visibility: anonymous=${anon} as-token=${auth}"
          if [ "$auth" != "200" ]; then
            if [ "$anon" = "200" ]; then
              echo "::error::${MIRROR_REPO} exists and is public, but MIRROR_TOKEN cannot see it. The token is the problem, not the repo: check its Resource owner is the org and not a personal account (this cannot be changed after creation — reissue), that the org has approved it under Settings -> Personal access tokens -> Pending requests, and that the repo is in its selected-repositories list."
            elif [ "$anon" = "403" ]; then
              echo "::error::Anonymous check was rate-limited, so this is inconclusive; the token still cannot read ${MIRROR_REPO}. Re-run, and if it persists treat it as a token problem."
            else
              echo "::error::Neither anonymously (${anon}) nor with the token (${auth}) can ${MIRROR_REPO} be read. Most likely it does not exist under that exact name — check it is named mirror03.github.io, owned by the org rather than a personal account, and public."
            fi
            exit 1
          fi
          # 200 but read-only is the other silent trap: the push would 403 with
          # nothing explaining why.
          if [ "$(curl -sS -H "Authorization: Bearer ${MIRROR_TOKEN}" "$API" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("permissions",{}).get("push"))')" != "True" ]; then
            echo "::error::MIRROR_TOKEN can read ${MIRROR_REPO} but not write to it. Set its Contents permission to Read and write."
            exit 1
          fi
          # Load-bearing. dist/CNAME claims fplanalyser.co.uk, and GitHub lets
          # exactly one Pages site hold a domain: publishing it here would pull
          # the domain off the real site and take fplanalyser.co.uk down.
          rm -f dist/CNAME
          test ! -e dist/CNAME
          touch dist/.nojekyll
          # index.html keeps its canonical -> fplanalyser.co.uk, so search
          # engines fold the mirror into the real domain rather than competing.
          cd dist
          git init -q
          git config user.name 'FPL Analyser'
          git config user.email '224126997+FPLAnalyser@users.noreply.github.com'
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          # Force: the mirror is build output, not history worth keeping.
          git push -q --force \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" \
            HEAD:main
