name: Refresh odds data

# Solves per-fixture goal expectancies (lambdas) from bookmaker odds into
# site_data/<season>/odds.json. Uses The Odds API when the ODDS_API_KEY repo
# secret is set — one daily pull costs 2 credits (2 markets x 1 UK region),
# ~62/month against the 500/month free tier — and falls back to the free
# football-data.co.uk fixtures file when no key is configured.
on:
  schedule:
    - cron: '20 6 * * *'   # daily, after the availability refresh
  workflow_dispatch:
    inputs:
      enrich:
        description: 'Also pull team totals per fixture (~1 credit each)'
        type: boolean
        default: false
      regions:
        description: 'Bookmaker regions (cost = markets x regions)'
        type: string
        default: 'uk'

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # A re-run replays an old commit; sync to the branch tip so the push
      # below is always a fast-forward.
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python refresh_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ENRICH: ${{ inputs.enrich && '1' || '' }}
          ODDS_REGIONS: ${{ inputs.regions || 'uk' }}
      - name: Commit if changed
        run: |
          git add site_data/*/odds.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh market odds lambdas"
          # Push, and if the branch has moved under us, rebase and try again.
          #
          # This is exactly how the 1 August refresh was lost. The job syncs to
          # the branch tip at checkout, then spends eleven minutes mirroring
          # images before it pushes — and a push that lands inside that window
          # rejects this one outright, taking the day's injuries, prices and
          # deadlines with it. The site sat on 31 July data for two days.
          # Rebase rather than merge: these commits touch only generated files
          # nobody edits by hand, so there is nothing to conflict with, and the
          # history stays linear the way the rest of this repo keeps it.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the branch tip"
            git pull --rebase origin main || exit 1
          done
          echo "still could not push after 5 attempts"
          exit 1
