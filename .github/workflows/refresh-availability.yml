name: Refresh availability data

# Pulls injuries/suspensions, chance-of-playing, set-piece duty and gameweek
# deadlines from the live FPL API into site_data/<season>/availability.json.
# A push to main from here triggers the Pages deploy, so the site follows the
# real world within a day (or on demand via workflow_dispatch).
on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC — after overnight press-conference news lands
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-availability
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # A re-run replays an old commit; sync to the branch tip so the push
      # below is always a fast-forward.
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pillow does the downscale-and-WebP in mirror_assets.py. Without it the
      # mirror step dies on the import, which is exactly how it failed the
      # first time it ran here.
      - run: pip install --quiet Pillow
      - run: python refresh_availability.py
      # Crests and headshots for anyone new, onto our own origin — a canvas
      # can only read back a same-origin image, so this is what keeps the
      # players and the badges in the share pictures. Idempotent, so a normal
      # morning fetches nothing.
      # continue-on-error, and it matters: the mirror is a nice-to-have, and
      # the first version of this step took the whole job down with it when
      # the image host answered 403 — losing that morning's injuries and
      # prices over some missing crests. The refresh commits either way.
      - run: python mirror_assets.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          # -A over the two directories: naming public/img explicitly made the
          # commit step fail outright on any run where the mirror had produced
          # nothing, taking the availability data down with it.
          git add -A site_data public
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh availability data and mirror any new club or player images"
          # Push, and if the branch has moved under us, rebase and try again.
          #
          # This is exactly how the 1 August refresh was lost. The job syncs to
          # the branch tip at checkout, then spends eleven minutes mirroring
          # images before it pushes — and a push that lands inside that window
          # rejects this one outright, taking the day's injuries, prices and
          # deadlines with it. The site sat on 31 July data for two days.
          # Rebase rather than merge: these commits touch only generated files
          # nobody edits by hand, so there is nothing to conflict with, and the
          # history stays linear the way the rest of this repo keeps it.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the branch tip"
            git pull --rebase origin main || exit 1
          done
          echo "still could not push after 5 attempts"
          exit 1
