name: Advance the gameweek

# Moves the site on to the next gameweek shortly after the current one locks,
# so people can start planning the next one straight away instead of waiting
# for Monday's final whistle.
#
# WHY IT POLLS. GitHub cron is a fixed UTC schedule and FPL deadlines are not:
# they move between Friday and Saturday, shift for cup weeks and midweek
# rounds, and get rewritten outright when a fixture is postponed. There is no
# way to schedule "thirty minutes after the deadline", and hard-coding the
# times would need a commit every time one moved — the failure mode being a
# silent no-show on exactly the weeks the schedule is unusual.
#
# So it runs on a quarter-hour and the work is decided by the DATA. Nearly
# every run is a checkout plus one unauthenticated API call — about twenty
# seconds — and exits saying there was nothing to do. advance_gameweek.py is
# idempotent and computes its answer from the deadlines rather than from what
# it last did, so a duplicate run, a run GitHub delayed, or a run missed
# entirely all end up in the same place.
#
# The window is 10:00–20:45 UTC. FPL deadlines have sat between roughly 11:00
# and 18:30 UTC for years, and the job needs to still be awake thirty minutes
# after the latest of them. Outside that window nothing fires. If FPL ever set
# one earlier or later, widen this — the job would be late rather than wrong,
# and the daily jobs would catch it the next morning either way.
#
# IT DOES NOT REFRESH ANYTHING ELSE. Injuries, prices, odds and ratings all
# have their own jobs and their own reasons to run at their own times. This one
# advances the pointer and trims the fixture grid, which is the part that
# cannot wait a day.
#
# THE ONE OTHER THING IT DOES, on the one run a week that actually moves the
# site: it freezes that gameweek's projection first. xP is computed in the
# browser at render time, so the moment odds or availability next refresh, what
# the site said before the deadline is gone. The deadline is the only moment it
# can be captured — teams set, nothing left to change it, nothing yet to
# overwrite it. Hence the awkward shape below: a dry run to ask whether this is
# that run, Node only if it is, snapshot, and only then advance for real.
on:
  schedule:
    - cron: '0,15,30,45 10-20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change without writing anything'
        type: boolean
        default: false
      snapshot_gw:
        description: 'Capture this gameweek''s projection now (recovery — normally left blank)'
        type: string
        default: ''

permissions:
  contents: write
  # To ask the Pages deploy to run — see the last step.
  actions: write

concurrency:
  group: advance-gameweek
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # A re-run replays an old commit; sync to the tip so the push below is
      # always a fast-forward.
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ask, without writing anything, whether this is a run that moves the
      # site — and if so which gameweek has just locked. Both come back as step
      # outputs; see the end of advance_gameweek.py. Nearly every run answers
      # "no" here and everything below is skipped.
      - name: Is this the run that moves the site?
        id: check
        run: python advance_gameweek.py --dry-run

      # ── the once-a-week part ──────────────────────────────────────────────
      #
      # ORDER MATTERS AND IT IS NOT OBVIOUS. The snapshot has to happen BEFORE
      # the advance, because advancing trims the locked gameweek out of
      # fixture_ease.json and the projection is built by matching players to
      # fixtures in it. Run the other way round it does not error — it writes a
      # file with nothing in it. Measured: 495 players before the trim, 0
      # after. snapshot_projections.mjs now refuses to write an empty file, so
      # getting this wrong fails the job rather than losing the gameweek.
      #
      # If the snapshot fails, the advance below never runs and the site sits
      # on the locked gameweek until the next quarter-hour, which retries.
      # That is the intended trade: being fifteen minutes late is recoverable,
      # and a projection missed at the deadline is not.
      #
      # `snapshot_gw` is the way back if one is missed anyway — it runs this
      # part on a named gameweek without waiting for a deadline. It is also how
      # this half gets exercised: pointed at a gameweek already stored, the
      # script says so and exits 0 without writing, which proves npm, esbuild
      # and the TypeScript imports all work here on a week when nothing moves.
      - uses: actions/setup-node@v4
        if: ${{ !inputs.dry_run && (inputs.snapshot_gw != '' || (steps.check.outputs.changed == 'true' && steps.check.outputs.locked_gw != '')) }}
        with:
          node-version: '20'
          cache: npm
      - name: Freeze what the site projected for GW${{ inputs.snapshot_gw || steps.check.outputs.locked_gw }}
        if: ${{ !inputs.dry_run && (inputs.snapshot_gw != '' || (steps.check.outputs.changed == 'true' && steps.check.outputs.locked_gw != '')) }}
        run: |
          npm ci
          # The script imports the site's own TypeScript — the same minutes and
          # xP code the browser runs, deliberately, so the record matches what
          # was on screen rather than a second implementation that drifts.
          ./node_modules/.bin/esbuild snapshot_projections.mjs \
            --bundle --platform=node --format=esm \
            --outfile=_snapshot.build.mjs --external:react
          node _snapshot.build.mjs ${{ inputs.snapshot_gw || steps.check.outputs.locked_gw }}
          rm -f _snapshot.build.mjs

      - name: Advance to the next unlocked gameweek
        run: python advance_gameweek.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit if the gameweek moved
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A site_data
          if git diff --cached --quiet; then
            echo "Nothing moved."
            exit 0
          fi
          NEXT=$(python -c "import json;print(json.load(open('site_data/2026-27/meta.json')).get('next_gw'))")
          MSG="Move the site on to GW${NEXT}"
          if git diff --cached --name-only | grep -q 'projections/'; then
            MSG="${MSG}, keeping GW${{ steps.check.outputs.locked_gw }}'s projection"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MSG"
          # Same retry as the daily refreshes: these commits touch only
          # generated files nobody edits by hand, so a branch that has moved
          # under us rebases cleanly and the history stays linear.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push rejected (attempt $attempt) — rebasing onto the branch tip"
            git pull --rebase origin main || exit 1
          done
          if [ "$pushed" -ne 1 ]; then
            echo "still could not push after 5 attempts"
            exit 1
          fi

          # ASK FOR THE DEPLOY, because the push will not. GitHub does not fire
          # `on: push` for a commit made with the workflow token, silently — so
          # without this the site would have moved on to the next gameweek in
          # the repository and nowhere else, which is the exact failure this
          # whole job exists to prevent. Only reached when something changed.
          curl -sS -X POST --fail-with-body \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}' && echo "deploy requested"
