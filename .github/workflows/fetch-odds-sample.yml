name: Fetch odds data

# Pulls Premier League odds CSVs from football-data.co.uk (free, no key):
# the completed season's results-with-closing-odds for model validation, and
# the forthcoming-fixtures file with current 1X2 / over-under odds. On demand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download odds CSVs
        run: |
          mkdir -p odds
          curl -fsSL "https://www.football-data.co.uk/mmz4281/2526/E0.csv" -o odds/E0_2025-26.csv
          curl -fsSL "https://www.football-data.co.uk/fixtures.csv" -o odds/fixtures_upcoming.csv || true
          wc -c odds/*.csv
      - name: Commit if changed
        run: |
          git add odds/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fetch odds sample from football-data.co.uk"
          # Push, and if the branch has moved under us, rebase and try again.
          #
          # This is exactly how the 1 August refresh was lost. The job syncs to
          # the branch tip at checkout, then spends eleven minutes mirroring
          # images before it pushes — and a push that lands inside that window
          # rejects this one outright, taking the day's injuries, prices and
          # deadlines with it. The site sat on 31 July data for two days.
          # Rebase rather than merge: these commits touch only generated files
          # nobody edits by hand, so there is nothing to conflict with, and the
          # history stays linear the way the rest of this repo keeps it.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the branch tip"
            git pull --rebase origin main || exit 1
          done
          echo "still could not push after 5 attempts"
          exit 1
