name: Draft social posts

# Reads the freshly-refreshed site_data and opens an issue containing two or
# three posts you can approve on a phone. It never publishes anything.
#
# That is the deliberate part. A bot that posts on a timer with nobody reading
# first is one bad morning of data away from saying something wrong to
# everyone at once, and an account that reads as automated does not get
# followed however good the numbers are. Approval costs about ten seconds;
# being wrong in public costs more than that.
#
# Runs after refresh-odds (06:20), the last of the three scheduled data jobs,
# so the drafts are built from the numbers that landed this morning rather
# than yesterday's.
on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many candidate posts to draft'
        type: string
        default: '3'
      polish:
        description: 'Rewrite the wording with Claude (needs ANTHROPIC_API_KEY)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: social-draft
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # A re-run replays the commit it was queued against; the whole point is
      # to draft from the data that landed this morning.
      - run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The drafter needs nothing installed — it reads JSON and prints text.
      # The optional rewrite needs the Anthropic SDK, so that is fetched only
      # when it is actually going to be used, rather than added to the site's
      # dependency tree for a step that is off by default. polish.mjs skips
      # itself if the import fails, so a flaky install costs the rewrite and
      # not the morning's drafts.
      - name: Anthropic SDK (only when rewriting)
        if: ${{ inputs.polish == true }}
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk

      # What went out recently, so the same story does not run three mornings
      # running. Read back off the issues, which are the record — a state file
      # alongside them would be a second one, free to drift.
      - name: What was drafted recently
        id: recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh issue list --label social-draft --state all --limit 5 --json body \
                  --jq '[.[].body | scan("<!-- story-ids: ([a-z,-]*) -->")[]] | join(",")' \
                2>/dev/null || true)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "recently drafted: ${ids:-none}"

      - name: Draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node tools/social/draft.mjs \
            --count "${{ inputs.count || '3' }}" \
            --exclude "${{ steps.recent.outputs.ids }}" \
            --json build/social/drafts.json \
            --markdown build/social/drafts.md \
            ${{ inputs.polish == true && '--polish' || '' }}

      # Uploaded before the issue is opened, so a formatting problem in the
      # issue body never costs the morning's drafts.
      - uses: actions/upload-artifact@v4
        with:
          name: social-drafts
          path: build/social/
          retention-days: 14

      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --label fails outright on a label that does not exist, which would
          # make the first run of this workflow the one that never posts.
          gh label create social-draft \
            --color 0E8A16 --description 'Candidate posts awaiting approval' \
            --force >/dev/null

          {
            echo "Pick one, copy the block, post it. Close this issue either way —"
            echo "the next run reads the last few to avoid repeating a story."
            echo
            cat build/social/drafts.md
            echo
            echo "---"
            echo "_Generated by \`tools/social/draft.mjs\` from \`site_data\`. Nothing here has been published._"
          } > body.md

          gh issue create \
            --title "Posts for $(date -u +%Y-%m-%d)" \
            --label social-draft \
            --body-file body.md
