<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>3D pitch — prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #080a0d; }
  body {
    font: 400 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e7ecf2;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(8,10,13,0), rgba(8,10,13,.86) 34%, rgba(8,10,13,.96));
    display: grid; gap: 10px;
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button {
    appearance: none; cursor: pointer;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.05);
    color: #cfd8e3;
    font: 700 12.5px/1 system-ui, sans-serif;
    letter-spacing: .02em;
    padding: 9px 13px; border-radius: 999px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tabs button:hover { background: rgba(255,255,255,.1); }
  .tabs button.on { background: #00e0a4; border-color: #00e0a4; color: #06120e; }
  h1 { margin: 0; font: 800 16px/1.2 system-ui, sans-serif; letter-spacing: -.01em; }
  p { margin: 0; max-width: 62ch; color: #9fadbd; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #8494a6; }
  label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  #fps { font-variant-numeric: tabular-nums; color: #00e0a4; font-weight: 700; }

  .badge {
    position: fixed; top: 0; right: 0; z-index: 6;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    border-bottom-left-radius: 12px;
    background: rgba(201,162,39,.16);
    border-left: 1px solid rgba(201,162,39,.4);
    border-bottom: 1px solid rgba(201,162,39,.4);
    font: 800 10px/1 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase;
    color: #F7E3A6;
  }
  #loading {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
    background: #080a0d; color: #5d6b7c; font-size: 13px; letter-spacing: .06em;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="badge">Prototype</div>
<div id="loading">loading squad…</div>

<div class="panel">
  <div class="tabs">
    <button data-variant="standing">Standing XI</button>
    <button data-variant="tabletop">Tabletop</button>
    <button data-variant="columns">Value columns</button>
  </div>
  <h1 id="v-title"></h1>
  <p id="v-blurb"></p>
  <div class="row">
    <label><input id="spin" type="checkbox" checked /> auto-rotate</label>
    <label><input id="shadows" type="checkbox" checked /> shadows</label>
    <span id="fps">—</span>
    <span>drag to orbit · pinch or scroll to zoom</span>
  </div>
</div>

<script type="module" src="./main.ts"></script>
</body>
</html>
