<head>
<meta charset="UTF-8">

<title>FPL Analyser | Data Driven FPL</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0b09">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  //
  // Must stay in step with src/lib/theme.tsx — if this picks a different
  // starting theme from the one React settles on, the page paints one and
  // then snaps to the other, which is worse than no script at all.
  //
  // Dark is the default, and the OS preference is deliberately not consulted:
  // the gold reads on dark the way the site was designed, and it is the theme
  // every shared image and screenshot is in. A visitor arriving from one of
  // those should see the thing they clicked. Light stays one tap away.
  (function () {
    try {
      var root = document.documentElement;
      var accent = 'aurum';
      var mode = localStorage.getItem('fpl_mode');
      if (mode !== 'light' && mode !== 'dark') mode = 'dark';
      root.dataset.accent = accent;
      root.dataset.mode = mode;
    } catch (e) {
      document.documentElement.dataset.accent = 'aurum';
      document.documentElement.dataset.mode = 'dark';
    }
  })();
</script>
<script>
  // 1) Purge the pre-migration service worker and its caches. A zombie legacy
  //    worker (script now deleted → 404 on update checks) can fall back to the
  //    OLD cached shell on a slow network, whose js/ files no longer exist —
  //    a broken page until refresh. Kill it and its 'fpl-analyser-*' caches.
  (function () {
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            var sw = reg.active || reg.waiting || reg.installing;
            if (sw && /service-worker\.js/.test(sw.scriptURL)) reg.unregister();
          });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { if (k.indexOf('fpl-analyser-') === 0) caches.delete(k); });
        }).catch(function () {});
      }
    } catch (e) { /* best effort */ }
  })();

  // Collect runtime errors from the very start so the #/debug page can show
  // them even when they happen before React mounts.
  (function () {
    window.__errlog = [];
    function log(kind, msg) {
      if (window.__errlog.length < 30) window.__errlog.push(new Date().toISOString().slice(11, 19) + ' [' + kind + '] ' + msg);
    }
    window.addEventListener('error', function (e) {
      log('error', (e.message || 'unknown') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; log('promise', (r && (r.message || String(r))) || 'unknown');
    });
  })();

  // 1b) A blank page must never be silent. If the app has not mounted a few
  //     seconds after load, put the collected errors ON SCREEN — the reader's
  //     screen, which is the only place the failure is visible. A phone that
  //     renders nothing gives its owner no way to tell anyone WHY, and a bug
  //     nobody can describe is a bug nobody can fix.
  //
  //     Deliberately ES5 with no template literals, arrow functions or
  //     optional chaining: this is the code that has to survive an engine too
  //     old to parse the bundle, which is one of the things it exists to
  //     report.
  (function () {
    var shown = false;
    function report() {
      if (shown) return;
      var root = document.getElementById('root');
      if (!root || root.childElementCount > 0) return;   // it mounted; nothing to say
      shown = true;
      var errs = (window.__errlog || []);
      var html = '<div style="max-width:38rem;margin:0 auto;padding:24px 18px;'
        + 'font:15px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#eef0f4">'
        + '<h1 style="font-size:19px;margin:0 0 8px">This page did not start</h1>'
        + '<p style="color:#a8acb3;margin:0 0 16px">The site loaded but the app failed to run on this device. '
        + 'The detail below is what went wrong \u2014 a screenshot of it is enough to fix the cause.</p>';
      if (errs.length) {
        html += '<pre style="white-space:pre-wrap;word-break:break-word;background:#131519;border:1px solid #2a2d33;'
          + 'border-radius:10px;padding:12px;font-size:12px;color:#e8907f;margin:0 0 16px">'
          + errs.join('\n').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; })
          + '</pre>';
      } else {
        html += '<p style="color:#a8acb3;margin:0 0 16px">No script error was recorded, which usually means the '
          + 'browser could not parse the app at all.</p>';
      }
      html += '<pre style="white-space:pre-wrap;word-break:break-word;background:#131519;border:1px solid #2a2d33;'
        + 'border-radius:10px;padding:12px;font-size:11px;color:#7e838b;margin:0 0 16px">'
        + navigator.userAgent + '\n' + location.href + '</pre>'
        + '<button id="__wipe" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #c9a227;'
        + 'background:transparent;color:#ead188;font:600 15px system-ui">Clear this site and reload</button></div>';
      root.innerHTML = html;
      var b = document.getElementById('__wipe');
      if (b) b.onclick = function () {
        try {
          if (window.caches && caches.keys) caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
          if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (r) {
            r.forEach(function (x) { x.unregister(); });
            setTimeout(function () { location.reload(); }, 300);
          }); else location.reload();
        } catch (e) { location.reload(); }
      };
    }
    if (window.addEventListener) {
      window.addEventListener('load', function () { setTimeout(report, 6000); });
      // Belt and braces: `load` never fires if a resource hangs.
      setTimeout(report, 12000);
    }
  })();

  // 2) Start the core data downloads NOW, during HTML parse — the app's data
  //    layer picks these promises up, cutting the JS-download-then-fetch chain
  //    out of the critical path (worth seconds on a phone connection).
  (function () {
    try {
      // Data is namespaced by season (site_data/<season>/…). Resolve the active
      // season synchronously so the eager fetches hit the right folder. Default
      // is the season current at build time; a stored choice overrides it, and
      // switching seasons reloads the page. (Update the default at rollover.)
      var season = '2026-27';
      try { var stored = localStorage.getItem('fpl_season'); if (stored) season = stored; } catch (e) {}
      window.__season = season;
      window.__early = {};
      [
        'ratings', 'personas_4gw', 'advanced_metrics', 'team_metrics',
        'season_to_date', 'player_tiers', 'fixture_ease', 'meta',
        'benchmarks', 'replacement_pool', 'persona_shifts', 'price_risk', 'player_form', 'teams'
      ].forEach(function (n) {
        window.__early[n] = fetch('site_data/' + season + '/' + n + '.json');
        window.__early[n].catch(function () {}); // avoid unhandled-rejection noise
      });
    } catch (e) { /* the data layer falls back to its own fetches */ }
  })();
</script>

<!-- One address for the site. The hash routes are fragments and never reach a
     server, and the github.io mirror already 301s here because of the CNAME —
     so the case this covers is a shared link coming back with ?utm_source= or
     ?fbclid= on it, which is otherwise a separate URL to a crawler. -->
<link rel="canonical" href="https://fplanalyser.co.uk/">
<meta name="description" content="Every Premier League player rated 0–100 on the numbers that predict Fantasy Premier League returns — expected goals, minutes, form and fixtures — then turned into transfer calls for your own team.">

<!-- Link preview. The full lockup is the card: when someone posts the site
     itself rather than an exported panel, this is the image that travels.
     og:image and og:url MUST be absolute — every scraper (X, Facebook,
     WhatsApp, iMessage, Slack) fetches the page without a document base and
     silently drops a relative path, so a relative one means no preview image
     at all. Everything else on the site uses a relative base for the Pages
     sub-path; these two are the deliberate exception. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="FPL Analyser">
<meta property="og:url" content="https://fplanalyser.co.uk/">
<meta property="og:title" content="FPL Analyser — Data. Insight. Points.">
